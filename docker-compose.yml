services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rahulgpt}
      POSTGRES_USER: ${POSTGRES_USER:-rahulgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rahulgpt_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rahulgpt} -d ${POSTGRES_DB:-rahulgpt}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rahulgpt:rahulgpt_local@postgres:5432/rahulgpt}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      CONNECTSAFELY_API_KEY: ${CONNECTSAFELY_API_KEY:-}
      CONNECTSAFELY_ACCOUNT_ID: ${CONNECTSAFELY_ACCOUNT_ID:-}
      CONNECTSAFELY_BASE_URL: ${CONNECTSAFELY_BASE_URL:-https://api.connectsafely.ai}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      ATS_CA_BUNDLE: ${ATS_CA_BUNDLE:-}
      OUTBOUND_CA_BUNDLE: ${OUTBOUND_CA_BUNDLE:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,backend}
      OUTREACH_DAILY_SEND_LIMIT: ${OUTREACH_DAILY_SEND_LIMIT:-100}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  discovery-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.discovery_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://rahulgpt:rahulgpt_local@postgres:5432/rahulgpt}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
      DISCOVERY_RUN_HOUR: ${DISCOVERY_RUN_HOUR:-8}
      DISCOVERY_TIMEZONE: ${DISCOVERY_TIMEZONE:-Asia/Kolkata}
      ATS_CA_BUNDLE: ${ATS_CA_BUNDLE:-}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend/certs:/app/certs:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
